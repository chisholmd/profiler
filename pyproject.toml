[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cda-profiler"
version = "0.1.0"
description = "Statistical data quality and type conformance profiler for HL7 CDA / C-CDA XML folders"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fast = ["lxml>=4.9.0", "rich>=13.0.0"]
dev = ["pytest>=7.0.0", "lxml>=4.9.0", "rich>=13.0.0"]

[project.scripts]
cda-profiler = "cda_profiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
